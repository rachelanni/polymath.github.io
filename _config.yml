###########################################################
# Global Configuration (https://jekyllrb.com/docs/configuration/options/)
###########################################################
# if you want to force HTTPS, specify the domain without the http at the start
# set domain: "your_github_user_name.github.io"
domain: ""

# your web site url
# for GitHub Pages, url: "https://your_github_user_name.github.io"
url: "https://rachelanni/polymath.github.io"

# path to this site
# if your page is located at https://your_github_user_name.github.io/blog, then set baseurl: "/blog"
baseurl: ""

# please use TZ database name column on the list table
# https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
#timezone: ""

###########################################################
# Front Matter Defaults (https://jekyllrb.com/docs/configuration/front-matter-defaults/)
###########################################################
defaults:
  # for posts
  - scope:
      # to separate language posts folders
      path: "_posts"
    values:
      layout: "post"
      permalink: /posts/:path

  # for multilingual posts
  - scope:
      # to separate language posts folders
      path: "*/_posts"
    values:
      hidden: true
      layout: "post"
      permalink: /:path

  # example: enable setting for all pages. You may still need to enable some setting from _data/conf/posts.yml or _data/conf/main.yml
  # - scope:
  #     # an empty string here means all files in the project
  #     path: ""
  #   values:
  #     image_viewer_on: true
  #     image_lazy_loader_on: true

###########################################################
# Markdown Options (https://jekyllrb.com/docs/configuration/markdown/)
# Configuring Jekyll in your GitHub Pages site (https://docs.github.com/en/pages/setting-up-a-github-pages-site-with-jekyll/about-github-pages-and-jekyll)
###########################################################
# This is default for GitHub Pages sites and cannot be changed.
highlighter: rouge
markdown: kramdown
kramdown:
  # This is default for GitHub Pages sites and cannot be changed.
  syntax_highlighter: rouge

###########################################################
# Plugins (Plugins supported by GitHub Pages https://pages.github.com/versions/)
###########################################################
plugins:
  - jekyll-paginate
  - jekyll-redirect-from

# since GitHub Pages runs jekyll with "--safe" flag, we need to add supported plugins in here. (only github supported plugins are allowed)
whitelist:
  - jekyll-paginate
  - jekyll-redirect-from

###########################################################
# jekyll-paginate (https://jekyllrb.com/docs/pagination/)
###########################################################
paginate_path: "/tabs/blog/:num"
# number of post per page
# make sure this matches with post_query_paginator_post_per_page in _data/conf/posts.yml
paginate: 5

###########################################################
# jekyll-redirect-from (https://github.com/jekyll/jekyll-redirect-from)
###########################################################
redirect_from:
  # Disabling generation of redirects.json
  json: false

###########################################################
# html compression (https://jch.penibelst.de)
###########################################################
compress_html:
  clippings: all
  comments: all
  #endings: all
  profile: false
  blanklines: false
  ignore:
    # disable this feature for development env.
    envs: [development]

###########################################################
# js compression (for removing comments(/**/only), line breaks and spaces)
# for debugging js files, simply set linebreak_and_space: false (in production env, this will be enabled automatically)
# for more info about environments (https://jekyllrb.com/docs/configuration/environments/)
###########################################################
compress_js:
  # enable or disable line breaks and space removal feature for development env.
  linebreak_and_space: false
  # disable this feature entirely for development or production env.
  #ignore: development

###########################################################
# Sass (https://jekyllrb.com/docs/assets/)
###########################################################
sass:
  sass_dir: assets/_scss
  # enable css compression
  style: compressed

###########################################################
# Exclude these files or folders from production site
###########################################################
exclude: ["Gemfile*", "vendor", ".github", ".vscode", "README*", "CODE_OF_CONDUCT.md", "LICENSE", "docs"]



# Site Settings
locale                   : "en-US"
rtl                      : false # turns direction of the page into right to left for RTL languages
title                    : "My Site"
title_separator          : "-"
subtitle                 : "A flexible Jekyll theme for your blog or site with a minimalist aesthetic.". # site tagline that appears below site title in masthead
name                     : "Rachel Harris"
description              : "An amazing website."
url                      : https://rachelanni/polymath.github.io # the base hostname & protocol for your site e.g. "https://mmistakes.github.io"
baseurl                  : "/blog" # the subpath of your site, e.g. 
repository               :  rachelanni/polymath.github.io
                          # GitHub username/repo-name e.g.    
teaser                   :  teaser: /assets/images/500x300.png # path of fallback teaser image, e.g. "/assets/images/500x300.png"
logo                     : # path of logo image to display in the masthead, e.g. "/assets/images/88x88.png"
masthead_title           : # overrides the website title displayed in the masthead, use " " for no title
breadcrumbs              :  false  # true,
words_per_minute         : 200
enable_copy_code_button  :  false  # true,
copyright                : # "copyright" name, defaults to site.title
copyright_url            : # "copyright" URL, defaults to site.url
comments:
  provider               : false  # "disqus", "discourse", "facebook", "staticman", "staticman_v2", "utterances", "giscus", "custom"
  disqus:
    shortname            : https://help.disqus.com/customer/portal/articles/466208-what-s-a-shortname-
  discourse:
    server               : https://meta.discourse.org/t/embedding-discourse-comments-via-javascript/31963 # , e.g.: meta.discourse.org
  facebook:
                         : https://developers.facebook.com/docs/plugins/comments
    appid                :
    num_posts            :  5 
    colorscheme          :  "light" 
  utterances:
    theme                :  "github-light" 
    issue_term           :  "pathname" 
  giscus:
    repo_id              : #Shown during giscus setup at https://giscus.app
    category_name        :  Full text name of the category
    category_id          : # Shown during giscus setup at https://giscus.app
    discussion_term      : "pathname" (default) # "url", "title", "og:title"
    reactions_enabled    :  '1' for enabled (default) # 0c disabled
    theme                : "light" (default)
                             #"dark", "dark_dimmed", "transparent_dark", "preferred_color_scheme"
    strict               : 0 for disabled (default) # 1 for enabled, 
    input_position       : "bottom" # The comment input box will be placed above or below the comments # "top", 
    emit_metadata        : 0 for disabled (default) # https://github.com/giscus/giscus/blob/main/ADVANCED-USAGE.md#imetadatamessage # 1 for enabled, 
    lang                 : "en" (default)
    lazy                 :  false # Loading of the comments will be deferred until the user scrolls near the comments container., # true,
  staticman:
    branch               : "master"
    endpoint             : # "https://{your Staticman v3 API}/v3/entry/github/"
reCaptcha:
  siteKey                :
  secret                 :
atom_feed:
  path                   : # blank (default) uses feed.xml
  hide                   :  false  # true,
search                   :  false # true,
search_full_content      :  false  # true,
search_provider          : lunr #, algolia, google
lunr:
  search_within_pages    :  false # true,
algolia:
  application_id         : # YOUR_APPLICATION_ID
  index_name             : # YOUR_INDEX_NAME
  search_only_api_key    : # YOUR_SEARCH_ONLY_API_KEY
  powered_by             : true  #, false
google:
  search_engine_id       : # YOUR_SEARCH_ENGINE_ID
  instant_search         : false # true
# SEO Related
google_site_verification :
bing_site_verification   :
naver_site_verification  :
yandex_site_verification :
baidu_site_verification  :

